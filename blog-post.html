<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Redirecting | MiGynae</title>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        if (id) {
          window.location.replace('/blog/' + encodeURIComponent(id));
        } else {
          window.location.replace('/blog');
        }
      })();
    </script>
</head>
<body>
    <p>Redirecting to <a href="/blog">MiGynae Blog</a>...</p>
</body>
</html>
